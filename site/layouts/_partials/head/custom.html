
<style>
/* 키보드로 선택했을 때만 카테고리 카드 테두리 표시 */
.article-list--tile article:has(:focus-visible) {
    outline: 2px solid #ffffff !important;
    outline-offset: 1px;
    border-radius: 8px;
}
</style>



<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("dark-mode-toggle");

    if (!toggle) return;

    // Tab 키로 선택할 수 있도록 설정
    toggle.setAttribute("tabindex", "0");
    toggle.setAttribute("role", "button");
    toggle.setAttribute("aria-label", "다크 모드와 라이트 모드 전환");

    // Enter 또는 Space 키로 테마 전환
    toggle.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggle.click();
        }
    });
});
</script>

<style>

/* 사이드바 메뉴 및 다크 모드 키보드 포커스 */
#main-menu a:focus-visible,
#dark-mode-toggle:focus-visible {
    outline: none !important;
    box-shadow: inset 0 0 0 1px currentColor;
    border-radius: 6px;
}

/* 테두리와 글자 사이 여유 공간 */
#main-menu a,
#dark-mode-toggle {
    padding: 5px 8px;
    box-sizing: border-box;
}

/* 다크 모드 선택 영역을 글자 크기에 맞춤 */
#dark-mode-toggle {
    width: fit-content;
    max-width: 100%;
}

</style>

<style>
/* 다크 모드 보조 텍스트의 색상 대비 개선 */
:root[data-scheme="dark"] {
    --card-text-color-tertiary: #d6d6d6;
}
</style>
